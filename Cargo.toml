[workspace]
members = [
    "kermes-server",
    "kermes-client",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Kermes Contributors"]
license = "MIT"
repository = "https://github.com/xcooper/kermes"

[workspace.dependencies]
tokio = { version = "1.41", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
