apiVersion: v1
kind: Namespace
metadata:
  name: kermes-debug
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kermes-server
  namespace: kermes-debug
  labels:
    app: kermes-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kermes-server
  template:
    metadata:
      labels:
        app: kermes-server
    spec:
      containers:
      - name: kermes-server
        image: kermes-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: proxy
          protocol: TCP
        env:
        - name: RUST_LOG
          value: "info"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: kermes-server
  namespace: kermes-debug
spec:
  selector:
    app: kermes-server
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: proxy
  type: ClusterIP
